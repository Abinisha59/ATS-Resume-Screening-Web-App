<!DOCTYPE html>
<html>

<head>

    <title>Analysis History</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

<div class="container">

<h1>Resume Analysis History</h1>

<table>

<tr>

<th>Resume</th>

<th>Role</th>

<th>Score</th>

<th>Date</th>

</tr>

{% for row in history %}

<tr>

<td>{{ row[0] }}</td>

<td>{{ row[1] }}</td>

<td>{{ row[2] }}%</td>

<td>{{ row[3] }}</td>

</tr>

{% endfor %}

</table>

</div>

</body>

</html>
